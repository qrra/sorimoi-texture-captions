<!doctype html><html lang="ko"><head><meta charset="UTF-8"><title>소리모이 자막</title></head><body><main><p class="eyebrow">SORIMOI · CAPTIONS</p><h1>먼저 자막을,<br>소리의 느낌까지.</h1><p id="summary" role="status">영상을 재생하고 자막 시작을 눌러주세요.</p><button id="liveStart">자막 시작</button><button id="replay" class="sub" hidden>준비된 자막과 다시 보기</button><button id="liveStop" class="quiet" hidden>자막 끄기</button><p id="status" role="status"></p><p class="note">기존 자막이 있으면 바로 표시해요. 없으면 첫 재생으로 분석한 뒤, 준비된 구간을 다시 볼 때 소리와 맞춰 보여드려요.</p><details><summary>자막 설정</summary><label class="row">자막 없으면 음성으로 만들기<input id="speechFallback" type="checkbox" checked></label><label class="row">효과음 글자 움직이기<input id="motion" type="checkbox" checked></label><label class="row">질감 강도<input id="amount" type="range" min="0" max="1" step=".1" value=".65"></label><p class="note">설정 변경 후 자막 다시 연결을 눌러주세요. 음성 인식은 틀릴 수 있습니다.</p><button id="studio" class="sub">파일 자막 검수 ↗</button><button id="apply" class="quiet">저장한 자막 적용</button><button id="remove" class="quiet">저장한 자막 지우기</button></details><p class="note">현재 탭의 소리만 기기 안에서 분석합니다. 마이크는 사용하지 않습니다.</p><p class="note">0.3.1</p></main><script type="module" src="./main.js"></script></body></html>
