<!doctype html><html lang="ko"><head><meta charset="UTF-8"><title>소리모이 라이브 자막</title></head><body><main><p class="eyebrow">SORIMOI · LIVE TEXTURE CAPTIONS</p><h1>지금 들리는 소리를<br>글자의 결로.</h1><p id="summary">유튜브 쇼츠나 영상을 재생하고 켜주세요.</p><button id="liveStart">이 탭에서 자막 켜기</button><button id="liveStop" class="sub" hidden>라이브 자막 끄기</button><p id="status" role="status"></p><p class="note">현재 탭의 소리를 기기 내에서 분석합니다. 음성 모델도 포함되어 있어 별도 다운로드·API 키가 필요 없습니다. 마이크는 사용하지 않습니다.</p><details><summary>자막 표시와 보조 기능</summary><label class="row">움직임 더하기<input id="motion" type="checkbox"></label><label class="row">질감 강도<input id="amount" type="range" min="0" max="1" step=".1" value=".65"></label><p class="note">설정은 다음 연결부터 적용합니다.</p><button id="studio" class="sub">파일 검수 스튜디오 ↗</button><button id="apply" class="quiet">저장한 검수 자막 적용</button><button id="remove" class="quiet">검수 자막 지우기</button></details><p class="note">유튜브 자막이 켜져 있으면 먼저 활용합니다. 자막이 없는 영상의 음성은 3~5초 단위로 후행 인식하며, PC에 따라 추가 지연이 있습니다. 쇼츠를 넘기면 이전 결과를 버립니다.</p></main><script type="module" src="./main.js"></script></body></html>
